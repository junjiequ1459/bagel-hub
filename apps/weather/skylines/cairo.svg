<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="currentColor" role="img" aria-label="Cairo skyline"><style>@media (prefers-reduced-motion: no-preference){.sk-beacon{animation:sk-blink 2.6s ease-in-out infinite}.sk-alt{animation-delay:-1.3s}.sk-twinkle{animation:sk-twinkle 3.2s ease-in-out infinite}.sk-pulse{animation:sk-pulse 4s ease-in-out infinite}.sk-wheel{animation:sk-spin 36s linear infinite}.sk-mill{animation:sk-spin 13s linear infinite}.sk-sway{animation:sk-sway 4.5s ease-in-out infinite alternate}.sk-sway2{animation-duration:5.6s;animation-delay:-2.2s}.sk-pine{animation:sk-sway 7s ease-in-out infinite alternate}.sk-bird{animation:sk-fly linear infinite}.sk-b1{animation-duration:34s}.sk-b2{animation-duration:47s;animation-delay:-21s}.sk-shuttle{animation:sk-shuttle 16s ease-in-out infinite}}.sk-beacon{opacity:.25}.sk-twinkle{opacity:.4}@keyframes sk-blink{0%,100%{opacity:.15}50%{opacity:1}}@keyframes sk-twinkle{0%,100%{opacity:.3}50%{opacity:1}}@keyframes sk-pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes sk-spin{to{transform:rotate(360deg)}}@keyframes sk-sway{from{transform:rotate(-1.8deg)}to{transform:rotate(2.2deg)}}@keyframes sk-fly{from{transform:translate(-36px,-2px)}to{transform:translate(436px,-12px)}}@keyframes sk-shuttle{0%,8%{transform:translate(0,0)}44%,56%{transform:translate(var(--dx),var(--dy))}92%,100%{transform:translate(0,0)}}</style><path d="M52 160 L150 48 L248 160 Z"/><path d="M196 160 L286 66 L376 160 Z"/><path d="M330 160 L372 114 L400 160 Z"/><path d="M30 138h86v22h-86Z"/><path d="M34 110h20v28h-20Z"/><path d="M28 116 L34 110 L34 128 L26 130 Z"/><path d="M54 110 L60 116 L62 130 L54 128 Z"/><g class="sk-bird sk-b1"><path transform="translate(0,52)" d="M0 0 Q3 -3.5 6 -0.5 Q9 -3.5 12 0 Q9 -1.8 6 0.6 Q3 -1.8 0 0 Z"/></g><g class="sk-bird sk-b2"><path transform="translate(0,68) scale(0.8)" d="M0 0 Q3 -3.5 6 -0.5 Q9 -3.5 12 0 Q9 -1.8 6 0.6 Q3 -1.8 0 0 Z"/></g></svg>