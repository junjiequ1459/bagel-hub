<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="currentColor" role="img" aria-label="Mumbai skyline"><style>@media (prefers-reduced-motion: no-preference){.sk-beacon{animation:sk-blink 2.6s ease-in-out infinite}.sk-alt{animation-delay:-1.3s}.sk-twinkle{animation:sk-twinkle 3.2s ease-in-out infinite}.sk-pulse{animation:sk-pulse 4s ease-in-out infinite}.sk-wheel{animation:sk-spin 36s linear infinite}.sk-mill{animation:sk-spin 13s linear infinite}.sk-sway{animation:sk-sway 4.5s ease-in-out infinite alternate}.sk-sway2{animation-duration:5.6s;animation-delay:-2.2s}.sk-pine{animation:sk-sway 7s ease-in-out infinite alternate}.sk-bird{animation:sk-fly linear infinite}.sk-b1{animation-duration:34s}.sk-b2{animation-duration:47s;animation-delay:-21s}.sk-shuttle{animation:sk-shuttle 16s ease-in-out infinite}}.sk-beacon{opacity:.25}.sk-twinkle{opacity:.4}@keyframes sk-blink{0%,100%{opacity:.15}50%{opacity:1}}@keyframes sk-twinkle{0%,100%{opacity:.3}50%{opacity:1}}@keyframes sk-pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes sk-spin{to{transform:rotate(360deg)}}@keyframes sk-sway{from{transform:rotate(-1.8deg)}to{transform:rotate(2.2deg)}}@keyframes sk-fly{from{transform:translate(-36px,-2px)}to{transform:translate(436px,-12px)}}@keyframes sk-shuttle{0%,8%{transform:translate(0,0)}44%,56%{transform:translate(var(--dx),var(--dy))}92%,100%{transform:translate(0,0)}}</style><path d="M120 160 L120 96 L240 96 L240 160 L202 160 L202 122 Q180 100 158 122 L158 160 Z"/><path d="M120 90h14v70h-14Z"/><path d="M118 90 Q127 77 136 90 Z"/><path d="M226 90h14v70h-14Z"/><path d="M224 90 Q233 77 242 90 Z"/><path d="M150 96 Q158 85 166 96 Z"/><path d="M171 92 Q180 79 189 92 Z"/><path d="M194 96 Q202 85 210 96 Z"/><path d="M270 110h100v50h-100Z"/><path d="M296 110 Q318 79 340 110 Z"/><path d="M317 84 L318 72 L319 84 Z"/><path d="M272 102h10v58h-10Z"/><path d="M270 102 Q277 92 284 102 Z"/><path d="M358 102h10v58h-10Z"/><path d="M356 102 Q363 92 370 102 Z"/><g class="sk-bird sk-b1"><path transform="translate(0,38)" d="M0 0 Q3 -3.5 6 -0.5 Q9 -3.5 12 0 Q9 -1.8 6 0.6 Q3 -1.8 0 0 Z"/></g><g class="sk-bird sk-b2"><path transform="translate(0,58) scale(0.8)" d="M0 0 Q3 -3.5 6 -0.5 Q9 -3.5 12 0 Q9 -1.8 6 0.6 Q3 -1.8 0 0 Z"/></g></svg>