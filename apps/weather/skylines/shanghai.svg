<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="currentColor" role="img" aria-label="Shanghai skyline"><style>@media (prefers-reduced-motion: no-preference){.sk-beacon{animation:sk-blink 2.6s ease-in-out infinite}.sk-alt{animation-delay:-1.3s}.sk-twinkle{animation:sk-twinkle 3.2s ease-in-out infinite}.sk-pulse{animation:sk-pulse 4s ease-in-out infinite}.sk-wheel{animation:sk-spin 36s linear infinite}.sk-mill{animation:sk-spin 13s linear infinite}.sk-sway{animation:sk-sway 4.5s ease-in-out infinite alternate}.sk-sway2{animation-duration:5.6s;animation-delay:-2.2s}.sk-pine{animation:sk-sway 7s ease-in-out infinite alternate}.sk-bird{animation:sk-fly linear infinite}.sk-b1{animation-duration:34s}.sk-b2{animation-duration:47s;animation-delay:-21s}.sk-shuttle{animation:sk-shuttle 16s ease-in-out infinite}}.sk-beacon{opacity:.25}.sk-twinkle{opacity:.4}@keyframes sk-blink{0%,100%{opacity:.15}50%{opacity:1}}@keyframes sk-twinkle{0%,100%{opacity:.3}50%{opacity:1}}@keyframes sk-pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes sk-spin{to{transform:rotate(360deg)}}@keyframes sk-sway{from{transform:rotate(-1.8deg)}to{transform:rotate(2.2deg)}}@keyframes sk-fly{from{transform:translate(-36px,-2px)}to{transform:translate(436px,-12px)}}@keyframes sk-shuttle{0%,8%{transform:translate(0,0)}44%,56%{transform:translate(var(--dx),var(--dy))}92%,100%{transform:translate(0,0)}}</style><path d="M20 124h40v36h-40Z"/><path d="M118 160 L146 104 L152 104 L124 160 Z"/><path d="M186 160 L158 104 L152 104 L180 160 Z"/><path d="M148 160 L150 120 L158 120 L160 160 Z"/><circle cx="152" cy="92" r="22"/><path d="M149 34h6v40h-6Z"/><circle cx="152" cy="30" r="11"/><path d="M151.3 19 L151.6 4 L152.6 4 L152.9 19 Z"/><circle class="sk-beacon" cx="152.1" cy="3" r="1.6"/><path d="M212 160 L212 120 L216 120 L216 96 L220 96 L220 76 L224 76 L224 58 L228 58 L228 46 L240 46 L240 58 L244 58 L244 76 L248 76 L248 96 L252 96 L252 120 L256 120 L256 160 Z"/><path d="M233 46 L234 29 L235 46 Z"/><