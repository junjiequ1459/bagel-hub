<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="currentColor" role="img" aria-label="San Francisco skyline"><style>@media (prefers-reduced-motion: no-preference){.sk-beacon{animation:sk-blink 2.6s ease-in-out infinite}.sk-alt{animation-delay:-1.3s}.sk-twinkle{animation:sk-twinkle 3.2s ease-in-out infinite}.sk-pulse{animation:sk-pulse 4s ease-in-out infinite}.sk-wheel{animation:sk-spin 36s linear infinite}.sk-mill{animation:sk-spin 13s linear infinite}.sk-sway{animation:sk-sway 4.5s ease-in-out infinite alternate}.sk-sway2{animation-duration:5.6s;animation-delay:-2.2s}.sk-pine{animation:sk-sway 7s ease-in-out infinite alternate}.sk-bird{animation:sk-fly linear infinite}.sk-b1{animation-duration:34s}.sk-b2{animation-duration:47s;animation-delay:-21s}.sk-shuttle{animation:sk-shuttle 16s ease-in-out infinite}}.sk-beacon{opacity:.25}.sk-twinkle{opacity:.4}@keyframes sk-blink{0%,100%{opacity:.15}50%{opacity:1}}@keyframes sk-twinkle{0%,100%{opacity:.3}50%{opacity:1}}@keyframes sk-pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes sk-spin{to{transform:rotate(360deg)}}@keyframes sk-sway{from{transform:rotate(-1.8deg)}to{transform:rotate(2.2deg)}}@keyframes sk-fly{from{transform:translate(-36px,-2px)}to{transform:translate(436px,-12px)}}@keyframes sk-shuttle{0%,8%{transform:translate(0,0)}44%,56%{transform:translate(var(--dx),var(--dy))}92%,100%{transform:translate(0,0)}}</style><path d="M92 52h7v108h-7Z"/><path d="M113 52h7v108h-7Z"/><path d="M92 58h28v6h-28Z"/><path d="M92 84h28v6h-28Z"/><path d="M92 112h28v6h-28Z"/><path d="M312 52h7v108h-7Z"/><path d="M333 52h7v108h-7Z"/><path d="M312 58h28v6h-28Z"/><path d="M312 84h28v6h-28Z"/><path d="M312 112h28v6h-28Z"/><path d="M0 124h400v7h-400Z"/><path d="M0 108 Q50 60 96 54 L96 60 Q52 66 0 114 Z"/><path d="M117 54 Q212 128 316 54 L316 60 Q212 134 117 60 Z"/><path d="M337 54 Q380 66 400 96 L400 102 Q378 72 337 60 Z"/><path d="M188 160 L203 40 L207 40 L222 160 Z"/><path d="M203.6 40 L205 24 L206.4 40 Z"/><circle