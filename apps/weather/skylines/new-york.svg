<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="currentColor" role="img" aria-label="New York skyline"><style>@media (prefers-reduced-motion: no-preference){.sk-beacon{animation:sk-blink 2.6s ease-in-out infinite}.sk-alt{animation-delay:-1.3s}.sk-twinkle{animation:sk-twinkle 3.2s ease-in-out infinite}.sk-pulse{animation:sk-pulse 4s ease-in-out infinite}.sk-wheel{animation:sk-spin 36s linear infinite}.sk-mill{animation:sk-spin 13s linear infinite}.sk-sway{animation:sk-sway 4.5s ease-in-out infinite alternate}.sk-sway2{animation-duration:5.6s;animation-delay:-2.2s}.sk-pine{animation:sk-sway 7s ease-in-out infinite alternate}.sk-bird{animation:sk-fly linear infinite}.sk-b1{animation-duration:34s}.sk-b2{animation-duration:47s;animation-delay:-21s}.sk-shuttle{animation:sk-shuttle 16s ease-in-out infinite}}.sk-beacon{opacity:.25}.sk-twinkle{opacity:.4}@keyframes sk-blink{0%,100%{opacity:.15}50%{opacity:1}}@keyframes sk-twinkle{0%,100%{opacity:.3}50%{opacity:1}}@keyframes sk-pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes sk-spin{to{transform:rotate(360deg)}}@keyframes sk-sway{from{transform:rotate(-1.8deg)}to{transform:rotate(2.2deg)}}@keyframes sk-fly{from{transform:translate(-36px,-2px)}to{transform:translate(436px,-12px)}}@keyframes sk-shuttle{0%,8%{transform:translate(0,0)}44%,56%{transform:translate(var(--dx),var(--dy))}92%,100%{transform:translate(0,0)}}</style><path d="M28 160 L28 128 L34 128 L34 121 L46 121 L46 128 L52 128 L52 160 Z"/><path d="M35 121 L37 97 L43 97 L45 121 Z"/><circle cx="40" cy="91" r="4.5"/><path d="M34 89 L31 83 L37 86 Z"/><path d="M39 85 L40 78 L41 85 Z"/><path d="M46 89 L49 83 L43 86 Z"/><path d="M43 104 L52 81 L55 82 L46 106 Z"/><path d="M53 80 L56 73 L58 79 L54 84 Z"/><path d="M62 112h26v48h-26Z"/><path d="M92 98h24v62h-24Z"/><path d="M128 160 L128 96 L134 96 L134 78 L141 78 L141 58 L147 58 L147 50 L159 50 L159 58 L165 58 L165 78 L172 78 L172 96 L178 96 L178 160 Z"/><path d="M152 50 L152.7 28 L153.9 28 L154.6 50 Z"/>