<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="currentColor" role="img" aria-label="Las Vegas skyline"><style>@media (prefers-reduced-motion: no-preference){.sk-beacon{animation:sk-blink 2.6s ease-in-out infinite}.sk-alt{animation-delay:-1.3s}.sk-twinkle{animation:sk-twinkle 3.2s ease-in-out infinite}.sk-pulse{animation:sk-pulse 4s ease-in-out infinite}.sk-wheel{animation:sk-spin 36s linear infinite}.sk-mill{animation:sk-spin 13s linear infinite}.sk-sway{animation:sk-sway 4.5s ease-in-out infinite alternate}.sk-sway2{animation-duration:5.6s;animation-delay:-2.2s}.sk-pine{animation:sk-sway 7s ease-in-out infinite alternate}.sk-bird{animation:sk-fly linear infinite}.sk-b1{animation-duration:34s}.sk-b2{animation-duration:47s;animation-delay:-21s}.sk-shuttle{animation:sk-shuttle 16s ease-in-out infinite}}.sk-beacon{opacity:.25}.sk-twinkle{opacity:.4}@keyframes sk-blink{0%,100%{opacity:.15}50%{opacity:1}}@keyframes sk-twinkle{0%,100%{opacity:.3}50%{opacity:1}}@keyframes sk-pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes sk-spin{to{transform:rotate(360deg)}}@keyframes sk-sway{from{transform:rotate(-1.8deg)}to{transform:rotate(2.2deg)}}@keyframes sk-fly{from{transform:translate(-36px,-2px)}to{transform:translate(436px,-12px)}}@keyframes sk-shuttle{0%,8%{transform:translate(0,0)}44%,56%{transform:translate(var(--dx),var(--dy))}92%,100%{transform:translate(0,0)}}</style><path d="M60 160 L74 84 L80 84 L70 160 Z"/><path d="M104 160 L90 84 L84 84 L94 160 Z"/><path d="M76 160 L79 84 L85 84 L88 160 Z"/><ellipse cx="82" cy="76" rx="22" ry="7"/><ellipse cx="82" cy="67" rx="15" ry="5"/><path d="M76 57h12v8h-12Z"/><path d="M80.8 57 L81.4 28 L82.8 28 L83.4 57 Z"/><circle class="sk-beacon" cx="82.1" cy="26.5" r="1.7"/><path d="M128 96h42v64h-42Z"/><path d="M176 110h36v50h-36Z"/><g class="sk-pulse"><circle cx="252" cy="124" r="34"/></g><path d="M296 160 L346 96 L396 160 Z"/><path d="M300 160 L302 116 L308 116 L310 160 Z"/><path d="M302 116 L305 105 L308 116 Z"/></svg>