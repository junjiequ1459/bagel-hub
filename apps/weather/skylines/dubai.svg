<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="currentColor" role="img" aria-label="Dubai skyline"><style>@media (prefers-reduced-motion: no-preference){.sk-beacon{animation:sk-blink 2.6s ease-in-out infinite}.sk-alt{animation-delay:-1.3s}.sk-twinkle{animation:sk-twinkle 3.2s ease-in-out infinite}.sk-pulse{animation:sk-pulse 4s ease-in-out infinite}.sk-wheel{animation:sk-spin 36s linear infinite}.sk-mill{animation:sk-spin 13s linear infinite}.sk-sway{animation:sk-sway 4.5s ease-in-out infinite alternate}.sk-sway2{animation-duration:5.6s;animation-delay:-2.2s}.sk-pine{animation:sk-sway 7s ease-in-out infinite alternate}.sk-bird{animation:sk-fly linear infinite}.sk-b1{animation-duration:34s}.sk-b2{animation-duration:47s;animation-delay:-21s}.sk-shuttle{animation:sk-shuttle 16s ease-in-out infinite}}.sk-beacon{opacity:.25}.sk-twinkle{opacity:.4}@keyframes sk-blink{0%,100%{opacity:.15}50%{opacity:1}}@keyframes sk-twinkle{0%,100%{opacity:.3}50%{opacity:1}}@keyframes sk-pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes sk-spin{to{transform:rotate(360deg)}}@keyframes sk-sway{from{transform:rotate(-1.8deg)}to{transform:rotate(2.2deg)}}@keyframes sk-fly{from{transform:translate(-36px,-2px)}to{transform:translate(436px,-12px)}}@keyframes sk-shuttle{0%,8%{transform:translate(0,0)}44%,56%{transform:translate(var(--dx),var(--dy))}92%,100%{transform:translate(0,0)}}</style><path d="M58 160 L58 148 Q60 70 106 56 L112 56 L112 160 Z"/><path d="M110 58 L119 35 L113 60 Z"/><path d="M126 118h22v42h-22Z"/><path d="M160 160 L160 140 L168 140 L168 118 L176 118 L176 96 L184 96 L184 72 L191 72 L191 46 L196 46 L196 24 L199 24 L199 10 L201 10 L201 24 L204 24 L204 46 L209 46 L209 72 L216 72 L216 96 L224 96 L224 118 L232 118 L232 140 L240 140 L240 160 Z"/><path d="M199.6 10 L200 3 L200.4 10 Z"/><circle class="sk-beacon" cx="200" cy="2.6" r="1.6"/><path d="M258 160 L258 84 L286 70 L286 160 Z"/><path d="M296 160 L296 96 L318 86 L318 160 Z"/><path d="M334 160 Q332 110 344 88