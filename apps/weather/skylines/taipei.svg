<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="currentColor" role="img" aria-label="Taipei skyline"><style>@media (prefers-reduced-motion: no-preference){.sk-beacon{animation:sk-blink 2.6s ease-in-out infinite}.sk-alt{animation-delay:-1.3s}.sk-twinkle{animation:sk-twinkle 3.2s ease-in-out infinite}.sk-pulse{animation:sk-pulse 4s ease-in-out infinite}.sk-wheel{animation:sk-spin 36s linear infinite}.sk-mill{animation:sk-spin 13s linear infinite}.sk-sway{animation:sk-sway 4.5s ease-in-out infinite alternate}.sk-sway2{animation-duration:5.6s;animation-delay:-2.2s}.sk-pine{animation:sk-sway 7s ease-in-out infinite alternate}.sk-bird{animation:sk-fly linear infinite}.sk-b1{animation-duration:34s}.sk-b2{animation-duration:47s;animation-delay:-21s}.sk-shuttle{animation:sk-shuttle 16s ease-in-out infinite}}.sk-beacon{opacity:.25}.sk-twinkle{opacity:.4}@keyframes sk-blink{0%,100%{opacity:.15}50%{opacity:1}}@keyframes sk-twinkle{0%,100%{opacity:.3}50%{opacity:1}}@keyframes sk-pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes sk-spin{to{transform:rotate(360deg)}}@keyframes sk-sway{from{transform:rotate(-1.8deg)}to{transform:rotate(2.2deg)}}@keyframes sk-fly{from{transform:translate(-36px,-2px)}to{transform:translate(436px,-12px)}}@keyframes sk-shuttle{0%,8%{transform:translate(0,0)}44%,56%{transform:translate(var(--dx),var(--dy))}92%,100%{transform:translate(0,0)}}</style><path d="M90 124h36v36h-36Z"/><path d="M130 136h30v24h-30Z"/><path d="M178 126h44v34h-44Z"/><path d="M174 114 L226 114 L220 126 L180 126 Z"/><path d="M174 102 L226 102 L220 114 L180 114 Z"/><path d="M174 90 L226 90 L220 102 L180 102 Z"/><path d="M174 78 L226 78 L220 90 L180 90 Z"/><path d="M174 66 L226 66 L220 78 L180 78 Z"/><path d="M174 54 L226 54 L220 66 L180 66 Z"/><path d="M174 42 L226 42 L220 54 L180 54 Z"/><path d="M174 30 L226 30 L220 42 L180 42 Z"/><path d="M191 22h18v8h-18Z"/><path d="M199.2 22 L200 4 L200.8 22 Z"/><circle class="sk-beacon" cx="200" cy="3" r="1.6"/><path d="M26