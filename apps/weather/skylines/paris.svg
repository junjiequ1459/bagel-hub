<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="currentColor" role="img" aria-label="Paris skyline"><style>@media (prefers-reduced-motion: no-preference){.sk-beacon{animation:sk-blink 2.6s ease-in-out infinite}.sk-alt{animation-delay:-1.3s}.sk-twinkle{animation:sk-twinkle 3.2s ease-in-out infinite}.sk-pulse{animation:sk-pulse 4s ease-in-out infinite}.sk-wheel{animation:sk-spin 36s linear infinite}.sk-mill{animation:sk-spin 13s linear infinite}.sk-sway{animation:sk-sway 4.5s ease-in-out infinite alternate}.sk-sway2{animation-duration:5.6s;animation-delay:-2.2s}.sk-pine{animation:sk-sway 7s ease-in-out infinite alternate}.sk-bird{animation:sk-fly linear infinite}.sk-b1{animation-duration:34s}.sk-b2{animation-duration:47s;animation-delay:-21s}.sk-shuttle{animation:sk-shuttle 16s ease-in-out infinite}}.sk-beacon{opacity:.25}.sk-twinkle{opacity:.4}@keyframes sk-blink{0%,100%{opacity:.15}50%{opacity:1}}@keyframes sk-twinkle{0%,100%{opacity:.3}50%{opacity:1}}@keyframes sk-pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes sk-spin{to{transform:rotate(360deg)}}@keyframes sk-sway{from{transform:rotate(-1.8deg)}to{transform:rotate(2.2deg)}}@keyframes sk-fly{from{transform:translate(-36px,-2px)}to{transform:translate(436px,-12px)}}@keyframes sk-shuttle{0%,8%{transform:translate(0,0)}44%,56%{transform:translate(var(--dx),var(--dy))}92%,100%{transform:translate(0,0)}}</style><path d="M40 120h70v40h-70Z"/><path d="M55 120 a20 20 0 0 1 40 0 Z"/><path d="M72 90h6v12h-6Z"/><path d="M70 90 L75 79 L80 90 Z"/><path d="M42 120 a10 10 0 0 1 20 0 Z"/><path d="M88 120 a10 10 0 0 1 20 0 Z"/><path d="M115 132h42v28h-42Z"/><path d="M168 100h64v7h-64Z"/><path d="M182 64h36v6h-36Z"/><path d="M192 64 L196 34 L204 34 L208 64 Z"/><path d="M199 34 L200 15 L201 34 Z"/><circle class="sk-beacon" cx="200" cy="13.5" r="2"/><path d="M184 100 Q186 80 189 70 L211 70 Q214 80 216 100 Z"/><path d="M152 160 Q168 122 176 107 L224 107 Q232 122 248 160 L232 160 Q216 130 200 124 Q184 130 168 16