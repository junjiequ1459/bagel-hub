<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="currentColor" role="img" aria-label="Singapore skyline"><style>@media (prefers-reduced-motion: no-preference){.sk-beacon{animation:sk-blink 2.6s ease-in-out infinite}.sk-alt{animation-delay:-1.3s}.sk-twinkle{animation:sk-twinkle 3.2s ease-in-out infinite}.sk-pulse{animation:sk-pulse 4s ease-in-out infinite}.sk-wheel{animation:sk-spin 36s linear infinite}.sk-mill{animation:sk-spin 13s linear infinite}.sk-sway{animation:sk-sway 4.5s ease-in-out infinite alternate}.sk-sway2{animation-duration:5.6s;animation-delay:-2.2s}.sk-pine{animation:sk-sway 7s ease-in-out infinite alternate}.sk-bird{animation:sk-fly linear infinite}.sk-b1{animation-duration:34s}.sk-b2{animation-duration:47s;animation-delay:-21s}.sk-shuttle{animation:sk-shuttle 16s ease-in-out infinite}}.sk-beacon{opacity:.25}.sk-twinkle{opacity:.4}@keyframes sk-blink{0%,100%{opacity:.15}50%{opacity:1}}@keyframes sk-twinkle{0%,100%{opacity:.3}50%{opacity:1}}@keyframes sk-pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes sk-spin{to{transform:rotate(360deg)}}@keyframes sk-sway{from{transform:rotate(-1.8deg)}to{transform:rotate(2.2deg)}}@keyframes sk-fly{from{transform:translate(-36px,-2px)}to{transform:translate(436px,-12px)}}@keyframes sk-shuttle{0%,8%{transform:translate(0,0)}44%,56%{transform:translate(var(--dx),var(--dy))}92%,100%{transform:translate(0,0)}}</style><path d="M46 160 L50 118 L54 118 L58 160 Z"/><path d="M36 88 C44 100 60 100 68 88 L58 124 L46 124 Z"/><path d="M84 160 L87 128 L90 128 L93 160 Z"/><path d="M77 104 C83 112 94 112 100 104 L93 130 L84 130 Z"/><path d="M118 100h26v60h-26Z"/><path d="M150 86h28v74h-28Z"/><path d="M184 108h22v52h-22Z"/><path d="M226 60 Q232 49 241 51 L392 51 L392 63 L232 63 Z"/><path d="M238 160 L248 63 L266 63 L268 160 Z"/><path d="M292 160 L298 63 L316 63 L318 160 Z"/><path d="M344 160 L350 63 L368 63 L370 160 Z"/><circle class="sk-beacon" cx="310" cy="47.5" r="2"/></svg>