<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="currentColor" role="img" aria-label="Washington DC skyline"><style>@media (prefers-reduced-motion: no-preference){.sk-beacon{animation:sk-blink 2.6s ease-in-out infinite}.sk-alt{animation-delay:-1.3s}.sk-twinkle{animation:sk-twinkle 3.2s ease-in-out infinite}.sk-pulse{animation:sk-pulse 4s ease-in-out infinite}.sk-wheel{animation:sk-spin 36s linear infinite}.sk-mill{animation:sk-spin 13s linear infinite}.sk-sway{animation:sk-sway 4.5s ease-in-out infinite alternate}.sk-sway2{animation-duration:5.6s;animation-delay:-2.2s}.sk-pine{animation:sk-sway 7s ease-in-out infinite alternate}.sk-bird{animation:sk-fly linear infinite}.sk-b1{animation-duration:34s}.sk-b2{animation-duration:47s;animation-delay:-21s}.sk-shuttle{animation:sk-shuttle 16s ease-in-out infinite}}.sk-beacon{opacity:.25}.sk-twinkle{opacity:.4}@keyframes sk-blink{0%,100%{opacity:.15}50%{opacity:1}}@keyframes sk-twinkle{0%,100%{opacity:.3}50%{opacity:1}}@keyframes sk-pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes sk-spin{to{transform:rotate(360deg)}}@keyframes sk-sway{from{transform:rotate(-1.8deg)}to{transform:rotate(2.2deg)}}@keyframes sk-fly{from{transform:translate(-36px,-2px)}to{transform:translate(436px,-12px)}}@keyframes sk-shuttle{0%,8%{transform:translate(0,0)}44%,56%{transform:translate(var(--dx),var(--dy))}92%,100%{transform:translate(0,0)}}</style><path d="M38 144h74v16h-74Z"/><path d="M46 114h6v30h-6Z"/><path d="M56 114h6v30h-6Z"/><path d="M66 114h6v30h-6Z"/><path d="M76 114h6v30h-6Z"/><path d="M86 114h6v30h-6Z"/><path d="M96 114h6v30h-6Z"/><path d="M40 104h70v12h-70Z"/><path d="M160 160 L166 60 L174 60 L180 160 Z"/><path d="M166 60 L170 39 L174 60 Z"/><circle class="sk-beacon" cx="170" cy="45" r="1.6"/><path d="M240 126h130v34h-130Z"/><path d="M280 116h50v44h-50Z"/><path d="M276 150h58v10h-58Z"/><path d="M292 96h26v20h-26Z"/><path d="M286 96 Q305 62 324 96 Z"/><path d="M300 54h10v9h-10Z"/><path d="M303.5 46h3v8h-3Z"/><cir