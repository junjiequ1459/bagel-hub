<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="currentColor" role="img" aria-label="Hong Kong skyline"><style>@media (prefers-reduced-motion: no-preference){.sk-beacon{animation:sk-blink 2.6s ease-in-out infinite}.sk-alt{animation-delay:-1.3s}.sk-twinkle{animation:sk-twinkle 3.2s ease-in-out infinite}.sk-pulse{animation:sk-pulse 4s ease-in-out infinite}.sk-wheel{animation:sk-spin 36s linear infinite}.sk-mill{animation:sk-spin 13s linear infinite}.sk-sway{animation:sk-sway 4.5s ease-in-out infinite alternate}.sk-sway2{animation-duration:5.6s;animation-delay:-2.2s}.sk-pine{animation:sk-sway 7s ease-in-out infinite alternate}.sk-bird{animation:sk-fly linear infinite}.sk-b1{animation-duration:34s}.sk-b2{animation-duration:47s;animation-delay:-21s}.sk-shuttle{animation:sk-shuttle 16s ease-in-out infinite}}.sk-beacon{opacity:.25}.sk-twinkle{opacity:.4}@keyframes sk-blink{0%,100%{opacity:.15}50%{opacity:1}}@keyframes sk-twinkle{0%,100%{opacity:.3}50%{opacity:1}}@keyframes sk-pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes sk-spin{to{transform:rotate(360deg)}}@keyframes sk-sway{from{transform:rotate(-1.8deg)}to{transform:rotate(2.2deg)}}@keyframes sk-fly{from{transform:translate(-36px,-2px)}to{transform:translate(436px,-12px)}}@keyframes sk-shuttle{0%,8%{transform:translate(0,0)}44%,56%{transform:translate(var(--dx),var(--dy))}92%,100%{transform:translate(0,0)}}</style><path d="M-5 160 L40 96 L80 112 L124 160 Z"/><path d="M60 160 L62 70 L92 70 L94 160 Z"/><path d="M104 112h22v48h-22Z"/><path d="M140 160 L140 78 L170 40 L170 160 Z"/><path d="M156 57 L156.6 30 L157.6 30 L158.2 57 Z"/><path d="M164 47 L164.6 21 L165.6 21 L166.2 47 Z"/><circle class="sk-beacon" cx="157.1" cy="28.5" r="1.6"/><circle class="sk-beacon sk-alt" cx="165.1" cy="19.5" r="1.6"/><path d="M186 160 L190 44 L216 44 L220 160 Z"/><path d="M190 44 L192 32 L194 44 Z"/><path d="M196 44 L198 30 L200 44 Z"/><path d="M202 44 L203 28 L204 44 Z"/><path d="M206 44 L208 30 L210 44 Z"/><path d="