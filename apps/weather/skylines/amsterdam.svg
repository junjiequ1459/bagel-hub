<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="currentColor" role="img" aria-label="Amsterdam skyline"><style>@media (prefers-reduced-motion: no-preference){.sk-beacon{animation:sk-blink 2.6s ease-in-out infinite}.sk-alt{animation-delay:-1.3s}.sk-twinkle{animation:sk-twinkle 3.2s ease-in-out infinite}.sk-pulse{animation:sk-pulse 4s ease-in-out infinite}.sk-wheel{animation:sk-spin 36s linear infinite}.sk-mill{animation:sk-spin 13s linear infinite}.sk-sway{animation:sk-sway 4.5s ease-in-out infinite alternate}.sk-sway2{animation-duration:5.6s;animation-delay:-2.2s}.sk-pine{animation:sk-sway 7s ease-in-out infinite alternate}.sk-bird{animation:sk-fly linear infinite}.sk-b1{animation-duration:34s}.sk-b2{animation-duration:47s;animation-delay:-21s}.sk-shuttle{animation:sk-shuttle 16s ease-in-out infinite}}.sk-beacon{opacity:.25}.sk-twinkle{opacity:.4}@keyframes sk-blink{0%,100%{opacity:.15}50%{opacity:1}}@keyframes sk-twinkle{0%,100%{opacity:.3}50%{opacity:1}}@keyframes sk-pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes sk-spin{to{transform:rotate(360deg)}}@keyframes sk-sway{from{transform:rotate(-1.8deg)}to{transform:rotate(2.2deg)}}@keyframes sk-fly{from{transform:translate(-36px,-2px)}to{transform:translate(436px,-12px)}}@keyframes sk-shuttle{0%,8%{transform:translate(0,0)}44%,56%{transform:translate(var(--dx),var(--dy))}92%,100%{transform:translate(0,0)}}</style><path d="M40 160 L40 104 L46 104 L46 96 L52 96 L52 88 L62 88 L62 96 L68 96 L68 104 L74 104 L74 160 Z"/><path d="M76 160 L76 112 Q78 112 80 106 Q84 98 88 96 L96 96 Q100 98 104 106 Q106 112 108 112 L108 160 Z"/><path d="M110 160 L110 108 L122 108 L122 92 L132 92 L132 108 L144 108 L144 160 Z"/><path d="M120 92 L127 83 L134 92 Z"/><path d="M146 160 L146 110 L162 90 L178 110 L178 160 Z"/><path d="M180 160 L180 106 L186 106 L186 96 L192 96 L192 86 L202 86 L202 96 L208 96 L208 106 L214 106 L214 160 Z"/><path d="M216 160 L216 116 Q218 116 220 110 Q224 102 228 100 L236 100 Q240 102 244 110 Q24