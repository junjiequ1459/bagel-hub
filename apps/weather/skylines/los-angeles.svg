<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="currentColor" role="img" aria-label="Los Angeles skyline"><style>@media (prefers-reduced-motion: no-preference){.sk-beacon{animation:sk-blink 2.6s ease-in-out infinite}.sk-alt{animation-delay:-1.3s}.sk-twinkle{animation:sk-twinkle 3.2s ease-in-out infinite}.sk-pulse{animation:sk-pulse 4s ease-in-out infinite}.sk-wheel{animation:sk-spin 36s linear infinite}.sk-mill{animation:sk-spin 13s linear infinite}.sk-sway{animation:sk-sway 4.5s ease-in-out infinite alternate}.sk-sway2{animation-duration:5.6s;animation-delay:-2.2s}.sk-pine{animation:sk-sway 7s ease-in-out infinite alternate}.sk-bird{animation:sk-fly linear infinite}.sk-b1{animation-duration:34s}.sk-b2{animation-duration:47s;animation-delay:-21s}.sk-shuttle{animation:sk-shuttle 16s ease-in-out infinite}}.sk-beacon{opacity:.25}.sk-twinkle{opacity:.4}@keyframes sk-blink{0%,100%{opacity:.15}50%{opacity:1}}@keyframes sk-twinkle{0%,100%{opacity:.3}50%{opacity:1}}@keyframes sk-pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes sk-spin{to{transform:rotate(360deg)}}@keyframes sk-sway{from{transform:rotate(-1.8deg)}to{transform:rotate(2.2deg)}}@keyframes sk-fly{from{transform:translate(-36px,-2px)}to{transform:translate(436px,-12px)}}@keyframes sk-shuttle{0%,8%{transform:translate(0,0)}44%,56%{transform:translate(var(--dx),var(--dy))}92%,100%{transform:translate(0,0)}}</style><path d="M240 160 L302 112 L342 126 L400 160 Z"/><path d="M320 160 L362 122 L400 138 L400 160 Z"/><path d="M150 160 L150 60 Q150 47 162 45 L178 45 Q190 47 190 60 L190 160 Z"/><path d="M158 37h24v8h-24Z"/><path d="M210 160 L210 58 L246 46 L246 160 Z"/><path d="M241 46 L242 23 L243.6 23 L244.6 48 Z"/><path d="M258 84h26v76h-26Z"/><g class="sk-sway" style="transform-box:view-box;transform-origin:61px 160px"><path d="M52 160 Q55 114 60 92 L63 93 Q58 115 56 160 Z"/><path d="M61 92 Q45 81 34 93 Q47 89 61 96 Z"/><path d="M61 92 Q75 80 87 90 Q74 88 61 96 Z"/><path d="M61 92 Q51 74 39 76 Q53