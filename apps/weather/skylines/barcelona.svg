<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="currentColor" role="img" aria-label="Barcelona skyline"><style>@media (prefers-reduced-motion: no-preference){.sk-beacon{animation:sk-blink 2.6s ease-in-out infinite}.sk-alt{animation-delay:-1.3s}.sk-twinkle{animation:sk-twinkle 3.2s ease-in-out infinite}.sk-pulse{animation:sk-pulse 4s ease-in-out infinite}.sk-wheel{animation:sk-spin 36s linear infinite}.sk-mill{animation:sk-spin 13s linear infinite}.sk-sway{animation:sk-sway 4.5s ease-in-out infinite alternate}.sk-sway2{animation-duration:5.6s;animation-delay:-2.2s}.sk-pine{animation:sk-sway 7s ease-in-out infinite alternate}.sk-bird{animation:sk-fly linear infinite}.sk-b1{animation-duration:34s}.sk-b2{animation-duration:47s;animation-delay:-21s}.sk-shuttle{animation:sk-shuttle 16s ease-in-out infinite}}.sk-beacon{opacity:.25}.sk-twinkle{opacity:.4}@keyframes sk-blink{0%,100%{opacity:.15}50%{opacity:1}}@keyframes sk-twinkle{0%,100%{opacity:.3}50%{opacity:1}}@keyframes sk-pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes sk-spin{to{transform:rotate(360deg)}}@keyframes sk-sway{from{transform:rotate(-1.8deg)}to{transform:rotate(2.2deg)}}@keyframes sk-fly{from{transform:translate(-36px,-2px)}to{transform:translate(436px,-12px)}}@keyframes sk-shuttle{0%,8%{transform:translate(0,0)}44%,56%{transform:translate(var(--dx),var(--dy))}92%,100%{transform:translate(0,0)}}</style><path d="M40 132h40v28h-40Z"/><path fill-rule="evenodd" d="M110 160 L110 120 L260 120 L260 160 Z M141 160 L141 140 Q150 127 159 140 L159 160 Z M176 160 L176 140 Q185 127 194 140 L194 160 Z M211 160 L211 140 Q220 127 229 140 L229 160 Z"/><path d="M107 160 Q110 123 115.5 78 L120.5 78 Q126 123 129 160 Z"/><circle cx="118" cy="74" r="3.2"/><path d="M126 160 Q129 99 137.5 54 L142.5 54 Q151 99 154 160 Z"/><circle cx="140" cy="50" r="3.2"/><path d="M155 160 Q158 85 167.5 40 L172.5 40 Q182 85 185 160 Z"/><circle cx="170" cy="36" r="3.2"/><path d="M185 160 Q188 81 197.5 36 L202.5 36 Q212 81 21