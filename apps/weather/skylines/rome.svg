<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="currentColor" role="img" aria-label="Rome skyline"><style>@media (prefers-reduced-motion: no-preference){.sk-beacon{animation:sk-blink 2.6s ease-in-out infinite}.sk-alt{animation-delay:-1.3s}.sk-twinkle{animation:sk-twinkle 3.2s ease-in-out infinite}.sk-pulse{animation:sk-pulse 4s ease-in-out infinite}.sk-wheel{animation:sk-spin 36s linear infinite}.sk-mill{animation:sk-spin 13s linear infinite}.sk-sway{animation:sk-sway 4.5s ease-in-out infinite alternate}.sk-sway2{animation-duration:5.6s;animation-delay:-2.2s}.sk-pine{animation:sk-sway 7s ease-in-out infinite alternate}.sk-bird{animation:sk-fly linear infinite}.sk-b1{animation-duration:34s}.sk-b2{animation-duration:47s;animation-delay:-21s}.sk-shuttle{animation:sk-shuttle 16s ease-in-out infinite}}.sk-beacon{opacity:.25}.sk-twinkle{opacity:.4}@keyframes sk-blink{0%,100%{opacity:.15}50%{opacity:1}}@keyframes sk-twinkle{0%,100%{opacity:.3}50%{opacity:1}}@keyframes sk-pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes sk-spin{to{transform:rotate(360deg)}}@keyframes sk-sway{from{transform:rotate(-1.8deg)}to{transform:rotate(2.2deg)}}@keyframes sk-fly{from{transform:translate(-36px,-2px)}to{transform:translate(436px,-12px)}}@keyframes sk-shuttle{0%,8%{transform:translate(0,0)}44%,56%{transform:translate(var(--dx),var(--dy))}92%,100%{transform:translate(0,0)}}</style><path fill-rule="evenodd" d="M36 160 L36 88 Q66 76 102 74 L136 74 L136 96 Q160 100 180 106 L180 160 Z M50 98 v-8 a6 6 0 0 1 12 0 v8 Z M72 98 v-8 a6 6 0 0 1 12 0 v8 Z M94 98 v-8 a6 6 0 0 1 12 0 v8 Z M116 98 v-8 a6 6 0 0 1 12 0 v8 Z M46 140 v-14 a6.5 6.5 0 0 1 13 0 v14 Z M68 140 v-14 a6.5 6.5 0 0 1 13 0 v14 Z M90 140 v-14 a6.5 6.5 0 0 1 13 0 v14 Z M112 140 v-14 a6.5 6.5 0 0 1 13 0 v14 Z M146 138 v-11 a5 5 0 0 1 10 0 v11 Z M163 138 v-11 a5 5 0 0 1 10 0 v11 Z"/><path d="M230 132h5v28h-5Z"/><g class="sk-pine" style="transform-box:view-box;transform-origin:232.5px 132px"><ellipse cx="232.5" cy="