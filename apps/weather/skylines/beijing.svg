<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="currentColor" role="img" aria-label="Beijing skyline"><style>@media (prefers-reduced-motion: no-preference){.sk-beacon{animation:sk-blink 2.6s ease-in-out infinite}.sk-alt{animation-delay:-1.3s}.sk-twinkle{animation:sk-twinkle 3.2s ease-in-out infinite}.sk-pulse{animation:sk-pulse 4s ease-in-out infinite}.sk-wheel{animation:sk-spin 36s linear infinite}.sk-mill{animation:sk-spin 13s linear infinite}.sk-sway{animation:sk-sway 4.5s ease-in-out infinite alternate}.sk-sway2{animation-duration:5.6s;animation-delay:-2.2s}.sk-pine{animation:sk-sway 7s ease-in-out infinite alternate}.sk-bird{animation:sk-fly linear infinite}.sk-b1{animation-duration:34s}.sk-b2{animation-duration:47s;animation-delay:-21s}.sk-shuttle{animation:sk-shuttle 16s ease-in-out infinite}}.sk-beacon{opacity:.25}.sk-twinkle{opacity:.4}@keyframes sk-blink{0%,100%{opacity:.15}50%{opacity:1}}@keyframes sk-twinkle{0%,100%{opacity:.3}50%{opacity:1}}@keyframes sk-pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes sk-spin{to{transform:rotate(360deg)}}@keyframes sk-sway{from{transform:rotate(-1.8deg)}to{transform:rotate(2.2deg)}}@keyframes sk-fly{from{transform:translate(-36px,-2px)}to{transform:translate(436px,-12px)}}@keyframes sk-shuttle{0%,8%{transform:translate(0,0)}44%,56%{transform:translate(var(--dx),var(--dy))}92%,100%{transform:translate(0,0)}}</style><path d="M58 150h124v10h-124Z"/><path d="M70 142h100v8h-100Z"/><path d="M68 132 Q120 112 172 132 L164 142 L76 142 Z"/><path d="M94 122h52v12h-52Z"/><path d="M82 106 Q120 88 158 106 L150 114 L90 114 Z"/><path d="M104 96h32v18h-32Z"/><path d="M96 82 Q120 68 144 82 L138 90 L102 90 Z"/><circle cx="120" cy="64" r="5"/><path d="M119 60 L120 51 L121 60 Z"/><g class="sk-twinkle"><circle cx="120" cy="48.5" r="2"/></g><path fill-rule="evenodd" d="M254 160 L274 48 L346 48 L358 160 Z M292 130 L300 74 L330 74 L334 130 Z"/><path d="M200 130h30v30h-30Z"/><path d="M370 122h26v38h-26Z"/><circle class="s